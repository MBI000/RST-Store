<section id="contact" class="page">
  <div class="section-head">
    <h3>Contact RST Store</h3>
    <p>Need a specific study tool? Send your request.</p>
  </div>
  <div class="contact-card">
    <h4>Support Form</h4>
    <p class="muted">Replies are typically sent within 24 hours.</p>
    <form class="contact-form" id="contactForm">
      <div class="field">
        <label for="contactName">Name</label>
        <input id="contactName" type="text" required />
      </div>
      <div class="field">
        <label for="contactEmail">Email</label>
        <input id="contactEmail" type="email" required />
      </div>
      <div class="field">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Send Message</button>
    </form>
  </div>
</section>
